<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="艺术与纪录影像"><title>艺术与纪录影像</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="cinema.css"></head><body>
<header class="nav"><div class="menu-wrap"><button id="menu-toggle" class="icon-button" aria-label="打开菜单" aria-expanded="false" aria-controls="more-menu"><span class="hamburger" aria-hidden="true"><i></i><i></i><i></i></span></button><nav id="more-menu" class="menu-panel" aria-label="主导航" hidden><button data-action="home" data-i18n="home">首页</button><button data-action="projects" data-i18n="projects">项目</button><button data-action="contact" data-i18n="contact">联系方式</button><button data-action="credits" data-i18n="credits">影像来源</button></nav></div>
<div class="language-wrap"><button id="language-toggle" aria-label="选择语言" aria-expanded="false" aria-controls="language-menu"><span id="current-language">中文</span><svg aria-hidden="true" width="10" height="6" viewBox="0 0 10 6"><path d="m1 1 4 4 4-4" fill="none" stroke="currentColor"/></svg></button><div id="language-menu" class="language-panel" role="group" aria-label="选择语言" hidden><button data-language="zh" lang="zh-CN" aria-pressed="true">中文</button><button data-language="en" lang="en" aria-pressed="false">English</button><button data-language="nb" lang="nb" aria-pressed="false">Norsk</button></div></div></header>
<main id="home"><section class="cinema-hero" aria-label="流动的黑白电影影像墙"><div class="film-wall" aria-hidden="true"></div><div class="cinema-shade" aria-hidden="true"></div><div class="film-grain" aria-hidden="true"></div><div class="artist-name"><h1 lang="zh-CN">位巍</h1><p lang="en">Wei Wei</p></div><button id="motion-toggle" class="icon-button" aria-label="暂停背景动画" aria-pressed="false"><svg class="pause-icon" aria-hidden="true" width="15" height="17" viewBox="0 0 15 17"><path d="M4 2v13M11 2v13" stroke="currentColor" stroke-width="1.5"/></svg><svg class="play-icon" aria-hidden="true" width="15" height="17" viewBox="0 0 15 17"><path d="m3 2 10 6.5L3 15Z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button></section></main>
<dialog id="projects-dialog" aria-labelledby="projects-title"><button class="close icon-button" data-i18n-aria="close" aria-label="关闭">×</button><div class="dialog-content"><h2 id="projects-title" data-i18n="projects">项目</h2><p data-i18n="sampleNotice">以下为示例项目，待替换为个人作品。</p><div class="project-list"><button data-project="0" data-i18n="project0">山的另一边</button><button data-project="1" data-i18n="project1">无声的海岸</button><button data-project="2" data-i18n="project2">日常的间隙</button></div></div></dialog>
<dialog id="project-detail" aria-labelledby="detail-title"><button class="close icon-button" data-i18n-aria="close" aria-label="关闭">×</button><img class="project-image" alt=""><div class="dialog-content"><h2 id="detail-title"></h2><p id="detail-text"></p></div></dialog>
<dialog id="contact-dialog" aria-labelledby="contact-title"><button class="close icon-button" data-i18n-aria="close" aria-label="关闭">×</button><div class="dialog-content"><h2 id="contact-title" data-i18n="contact">联系方式</h2><p data-i18n="contactPending">联系方式待更新。</p></div></dialog>
<dialog id="credits-dialog" aria-labelledby="credits-title"><button class="close icon-button" data-i18n-aria="close" aria-label="关闭">×</button><div class="dialog-content"><h2 id="credits-title" data-i18n="credits">影像来源</h2><div class="film-credits"></div><p data-i18n="sourceNote">档案影像来自 Wikimedia Commons。点击图片查看作者、许可和原始资料。</p></div></dialog>
<script src="script.js"></script><script src="cinema.js"></script></body></html>
